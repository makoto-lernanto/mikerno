[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# `code-model=large` permesas al `horizonto` esti ligita super 4 GiB.
# `relocation-model=pic` igas la kernan bildon pozicio-sendependa (ET_DYN), por
# ke la KASLR-ŝelko povas kopii ĝin al hazarda bazo; `horizonto` mem ligas kun
# `-no-pie`, do ĝi restas ET_EXEC sen dinamikaj relokoj.
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "relocation-model=pic",
    "-C", "code-model=large",
]

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))']
runner = 'cmd /c tools\run-qemu.cmd'
