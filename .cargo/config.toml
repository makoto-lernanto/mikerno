[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# `code-model=large` permesas al `horizonto` esti ligita super 4 GiB.
# `relocation-model=pic` igas la kernan bildon pozicio-sendependa (ET_DYN), por
# ke la KASLR-ŝelko povas kopii ĝin al hazarda bazo; `horizonto` mem ligas kun
# `-no-pie`, do ĝi restas ET_EXEC sen dinamikaj relokoj.
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "relocation-model=pic",
    "-C", "code-model=large",
]

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))']
runner = 'bash tools/run-qemu.sh'

[target.aarch64-unknown-none]
# La arm64-bildo estas ligita kiel plata `Image` per `boot/linker-arm64.ld`
# (la kerno mem liveras ĝin per `build.rs`). `+pan` nur permesas la
# `MSR PAN`-instrukciojn; la kerno kontrolas la subtenon per
# `ID_AA64MMFR1_EL1` antaŭ ol uzi ilin.
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "target-feature=+pan",
]

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))']
runner = 'bash tools/run-qemu-arm.sh'
