name: DI

on:
  push:
    branches:
      - main
  pull_request:

# La laborfluo nur legas la deponejon.
permissions:
  contents: read

jobs:
  # Rapida rimensaĝo: versio, unu-testoj, formato, statika analizo (ambaŭ arkoj)
  # kaj konstruo.
  kontroli-kaj-konstrui:
    name: Kontroli kaj konstrui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      # `just kontroli` lintas ankaŭ por aarch64-unknown-none, inkluzive la
      # uzantajn bildojn kun la Ligo-komandoj; la minimuma rustup-profila ne
      # enhavas rustfmt/clippy, do ili estas petitaj.
      # `llvm-tools-preview` liveras `rust-objcopy` por `konstrui-arm`.
      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: x86_64-unknown-none,aarch64-unknown-none

      - name: Instali just
        uses: taiki-e/install-action@just

      - name: Ruli just kontroli
        run: just kontroli

      # `kontroli` lintas la arm64-kernon kaj la uzantajn bildojn, sed ne
      # ligas la kernon; ĉi tiu paŝo ankaŭ ligas ĝin kaj konvertas la ELF-on al
      # la plata `Image`, do rompo en la arm64-bildo malkovriĝas en DI anstataŭ
      # nur loke.
      - name: Konstrui la arm64-bildon
        run: just konstrui-arm

  # Miri interpretas la MIR-on de la gastigantaj unu-testoj de `kernologiko`
  # kaj kaptas nedifinitan konduton (precipe en la `unsafe`-uzado), kiun la
  # ordinara testa rultempo ne montras. Ĝi bezonas noktan ilĉenon.
  miri-kontroli:
    name: Miri-kontrolo de kernologiko
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust nightly kun Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Instali just
        uses: taiki-e/install-action@just

      - name: Ruli just miri
        run: just miri

  # Kani bezonas la liston de la pruvoj por la matrico. `cargo kani list`
  # skribas `kani-list.json` kun la plenaj (modulaj) nomoj de la pruvoj.
  kani-pretigi:
    name: Pretigi la liston de Kani-pruvoj
    runs-on: ubuntu-latest
    needs: kontroli-kaj-konstrui
    timeout-minutes: 30
    outputs:
      pruvoj: ${{ steps.listo.outputs.pruvoj }}
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none

      # La oficiala ago instalas Kani kun kongrua CBMC. Ĝi interne ŝaltas
      # `stable`, do la sekvaj paŝoj restarigas 1.100.0.
      - name: Instali Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: latest
          command: kani
          args: --version

      - name: Listigi la pruvojn
        id: listo
        run: |
          rustup default 1.100.0
          cargo kani -p mikerno -Z unstable-options --ignore-global-asm \
            list --format json
          nombro=$(jq '."standard-harnesses" | [.[][]] | length' kani-list.json)
          echo "Pruvoj: $nombro"
          test "$nombro" -gt 0
          echo "pruvoj=$(jq -c '."standard-harnesses" | [.[][]] | to_entries | map({indekso: .key, pruvo: .value})' kani-list.json)" >> "$GITHUB_OUTPUT"

  # Unu pruvo por tasko: pruvo, kiu blokiĝas, estas nuligita de `timeout`
  # post 10 minutoj kaj ĝia protokolo supreniĝas; la ceteraj finiĝas sendepende.
  kani-kontroli:
    name: Formala kontrolo per Kani (${{ matrix.pruvo }})
    runs-on: ubuntu-latest
    needs: kani-pretigi
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.kani-pretigi.outputs.pruvoj) }}
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none

      - name: Instali Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: latest
          command: kani
          args: --version

      # `--exact` malhelpas, ke prefiksa nomo (ekz. `fifo_ordo`) ankaŭ
      # elektu `fifo_ordo_inter_fontoj`.
      - name: Ruli unu pruvon
        shell: bash
        env:
          PRUVO: ${{ matrix.pruvo }}
        run: |
          rustup default 1.100.0
          set -o pipefail
          echo "Pruvo: $PRUVO (limo 600 s)"
          timeout -k 10 600 cargo kani -p mikerno -Z unstable-options \
            --ignore-global-asm --exact --harness "$PRUVO" 2>&1 | tee kani.log

      - name: Alŝuti la protokolon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-${{ matrix.indekso }}
          path: kani.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  # La ISO-oj konstruiĝas unufoje el la sama kodo, kiun kontrolas la unua
  # tasko. La QEMU-matrico elŝutas ilin kiel artefaktojn, do ĝi praŝarĝas la
  # saman bildon, kiun uzanto elŝutos; la deponejo mem ne tenas la ISO-ojn.
  paki-iso:
    name: Konstrui la ISO-ojn
    runs-on: ubuntu-latest
    needs: kontroli-kaj-konstrui
    timeout-minutes: 20
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: llvm-tools-preview
          targets: x86_64-unknown-none,aarch64-unknown-none

      - name: Instali just
        uses: taiki-e/install-action@just

      - name: Instali la ISO-ilojn
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso dosfstools mtools

      - name: Konstrui la x86_64-ISO-on
        run: just iso

      - name: Konstrui la arm64-ISO-on
        run: just iso-arm

      - name: Alŝuti la ISO-ojn
        uses: actions/upload-artifact@v4
        with:
          name: iso-bildoj
          path: |
            mikerno.iso
            mikerno-arm.iso
          if-no-files-found: error
          retention-days: 90

      # La rekta arm64-`Image`-praŝarĝo bezonas la plataĵon kaj la modulojn,
      # kiujn `konstrui-arm` lasas en `target/`.
      - name: Alŝuti la arm64-bildojn
        uses: actions/upload-artifact@v4
        with:
          name: arm64-bildoj
          path: |
            target/aarch64-unknown-none/release/mikerno.img
            target/aarch64-unknown-none/release/horizonto
            target/aarch64-unknown-none/release/saluto
          if-no-files-found: error
          retention-days: 90

  # Kvin praŝarĝoj: BIOS kaj UEFI sur x86_64, malgranda memoro, rekta arm64
  # `Image` kaj UEFI-ISO sur arm64. Ĉiu praŝarĝo rajtas daŭri 60 sekundojn;
  # poste `timeout` ĝin finas, ĉar la kerno restas en senfina buklo post la
  # fina stato. Sukceso postulas la finan staton SEN `MALBONE`.
  qemu-kontroli:
    name: QEMU-matrico (${{ matrix.nomo }})
    runs-on: ubuntu-latest
    needs: paki-iso
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - nomo: x86_64 BIOS 256M
            komando: bash tools/run-qemu.sh iso
            masino: ""
            memoro: 256M
            uefi: "0"
          - nomo: x86_64 UEFI 256M
            komando: bash tools/run-qemu.sh iso
            masino: q35
            memoro: 256M
            uefi: "1"
          - nomo: x86_64 BIOS 128M
            komando: bash tools/run-qemu.sh iso
            masino: ""
            memoro: 128M
            uefi: "0"
          - nomo: arm64 Image 256M
            komando: bash tools/run-qemu-arm.sh release
            masino: virt
            memoro: 256M
            uefi: "0"
          - nomo: arm64 UEFI 256M
            komando: bash tools/run-qemu-arm.sh --iso
            masino: virt
            memoro: 256M
            uefi: "0"
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Elŝuti la ISO-ojn
        uses: actions/download-artifact@v4
        with:
          name: iso-bildoj
          path: .

      - name: Elŝuti la arm64-bildojn
        uses: actions/download-artifact@v4
        with:
          name: arm64-bildoj
          path: target/aarch64-unknown-none/release

      - name: Instali QEMU kaj la UEFI-firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm \
            ovmf qemu-efi-aarch64

      - name: Praŝarĝi kaj kontroli
        shell: bash
        env:
          QEMU_DISPLAY: none
          QEMU_MASINO: ${{ matrix.masino }}
          QEMU_MEMORO: ${{ matrix.memoro }}
          QEMU_UEFI: ${{ matrix.uefi }}
        run: bash tools/kontroli-qemu.sh 60 ${{ matrix.komando }}
