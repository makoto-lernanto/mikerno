name: DI

on:
  push:
    branches:
      - main
  pull_request:

# La laborfluo nur legas la deponejon.
permissions:
  contents: read

jobs:
  # Rapida rimensaĝo: versio, unu-testoj, formato, statika analizo (ambaŭ arkoj)
  # kaj konstruo.
  kontroli-kaj-konstrui:
    name: Kontroli kaj konstrui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      # `just kontroli` lintas ankaŭ por aarch64-unknown-none, inkluzive la
      # uzantajn bildojn kun la Ligo-komandoj; la minimuma rustup-profila ne
      # enhavas rustfmt/clippy, do ili estas petitaj.
      # `llvm-tools-preview` liveras `rust-objcopy` por `konstrui-arm`.
      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: x86_64-unknown-none,aarch64-unknown-none

      - name: Instali just
        uses: taiki-e/install-action@just

      - name: Ruli just kontroli
        run: just kontroli

      # `kontroli` lintas la arm64-kernon kaj la uzantajn bildojn, sed ne
      # ligas la kernon; ĉi tiu paŝo ankaŭ ligas ĝin kaj konvertas la ELF-on al
      # la plata `Image`, do rompo en la arm64-bildo malkovriĝas en DI anstataŭ
      # nur loke.
      - name: Konstrui la arm64-bildon
        run: just konstrui-arm

  # Kani bezonas la liston de la pruvoj por la matrico. `cargo kani list`
  # skribas `kani-list.json` kun la plenaj (modulaj) nomoj de la pruvoj.
  kani-pretigi:
    name: Pretigi la liston de Kani-pruvoj
    runs-on: ubuntu-latest
    needs: kontroli-kaj-konstrui
    timeout-minutes: 30
    outputs:
      pruvoj: ${{ steps.listo.outputs.pruvoj }}
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none

      # La oficiala ago instalas Kani kun kongrua CBMC. Ĝi interne ŝaltas
      # `stable`, do la sekvaj paŝoj restarigas 1.100.0.
      - name: Instali Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: latest
          command: kani
          args: --version

      - name: Listigi la pruvojn
        id: listo
        run: |
          rustup default 1.100.0
          cargo kani -p mikerno -Z unstable-options --ignore-global-asm \
            list --format json
          nombro=$(jq '."standard-harnesses" | [.[][]] | length' kani-list.json)
          echo "Pruvoj: $nombro"
          test "$nombro" -gt 0
          echo "pruvoj=$(jq -c '."standard-harnesses" | [.[][]] | to_entries | map({indekso: .key, pruvo: .value})' kani-list.json)" >> "$GITHUB_OUTPUT"

  # Unu pruvo por tasko: pruvo, kiu blokiĝas, estas nuligita de `timeout`
  # post 10 minutoj kaj ĝia protokolo supreniĝas; la ceteraj finiĝas sendepende.
  kani-kontroli:
    name: Formala kontrolo per Kani (${{ matrix.pruvo }})
    runs-on: ubuntu-latest
    needs: kani-pretigi
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.kani-pretigi.outputs.pruvoj) }}
    steps:
      - name: Elpreni la deponejon
        uses: actions/checkout@v4

      - name: Instali Rust 1.100.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none

      - name: Instali Kani
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: latest
          command: kani
          args: --version

      # `--exact` malhelpas, ke prefiksa nomo (ekz. `fifo_ordo`) ankaŭ
      # elektu `fifo_ordo_inter_fontoj`.
      - name: Ruli unu pruvon
        shell: bash
        env:
          PRUVO: ${{ matrix.pruvo }}
        run: |
          rustup default 1.100.0
          set -o pipefail
          echo "Pruvo: $PRUVO (limo 600 s)"
          timeout -k 10 600 cargo kani -p mikerno -Z unstable-options \
            --ignore-global-asm --exact --harness "$PRUVO" 2>&1 | tee kani.log

      - name: Alŝuti la protokolon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-${{ matrix.indekso }}
          path: kani.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
