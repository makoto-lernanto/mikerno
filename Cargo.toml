[workspace]
members = ["mikerno", "libmikerno", "horizonto", "saluto"]
resolver = "2"

[workspace.package]
version = "0.7.3"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
strip = true

[profile.release.package.horizonto]
opt-level = "z"
codegen-units = 1

[profile.release.package.saluto]
opt-level = "z"
codegen-units = 1
